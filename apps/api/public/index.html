<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Game Pipeline Agents</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-main">
            <div class="brand-mark">GP</div>
            <div>
              <h1>Game Pipeline Agents</h1>
              <p>全流程微信小游戏 Agent Studio</p>
            </div>
          </div>
          <button id="open-settings" class="icon-button" type="button" aria-label="打开设置" title="设置">⚙</button>
        </div>

        <form id="project-form" class="project-form">
          <label>
            项目名称
            <input id="project-name" value="毛线球防守" autocomplete="off" />
          </label>
          <label>
            初始 idea
            <textarea id="project-idea" rows="7">做一个微信小游戏，玩家用点击防守毛线球，不让它们滚出篮子，单局一分钟，画风轻松可爱。</textarea>
          </label>
          <button type="submit">创建项目</button>
        </form>

        <section class="panel">
          <div class="panel-heading">
            <h2>已有项目</h2>
            <span id="project-list-summary">0</span>
          </div>
          <div id="project-list" class="project-list"></div>
        </section>

        <section class="panel">
          <h2>房间</h2>
          <div id="room-list" class="room-list"></div>
        </section>
      </aside>

      <main class="chat-column">
        <header class="topbar">
          <div>
            <div class="eyebrow">当前项目</div>
            <h2 id="project-title">未创建</h2>
          </div>
          <div class="stage-pill" id="project-stage">等待 idea</div>
        </header>

        <section class="chat-panel">
          <div id="message-list" class="message-list empty-state">创建项目后，策划和美术 Agent 会先进入开局讨论。</div>
        </section>

        <section class="composer">
          <div class="quick-actions">
            <button data-preset="stage1" type="button">确认立项</button>
            <button data-preset="playable" type="button">首个可玩通过</button>
            <button data-preset="release" type="button">批准发布</button>
            <button data-preset="progress" type="button">询问进度</button>
          </div>
          <div class="composer-row">
            <select id="message-type">
              <option value="plan_submission">计划/需求</option>
              <option value="decision_record">制作人决策</option>
              <option value="change_request">变更请求</option>
              <option value="progress_update">进度询问</option>
            </select>
            <div class="mention-composer-field">
              <textarea id="message-content" rows="2" placeholder="向 Agent 群聊发送消息，输入 @ 可选择角色，也可以手动输入任意 @内容"></textarea>
              <div id="mention-suggestions" class="mention-suggestions" role="listbox" hidden></div>
            </div>
            <button id="send-message" type="button">发送</button>
          </div>
        </section>
      </main>

      <aside class="workspace-column">
        <section class="panel">
          <div class="panel-heading">
            <h2>任务板</h2>
            <span id="task-summary">0</span>
          </div>
          <div id="task-board" class="task-board"></div>
        </section>

        <section class="panel">
          <div class="panel-heading">
            <h2>交付物</h2>
            <span id="artifact-summary">0</span>
          </div>
          <div id="artifact-list" class="artifact-list"></div>
        </section>

        <section class="panel">
          <div class="panel-heading">
            <h2>团队进展</h2>
            <span id="workspace-root">制作人视图</span>
          </div>
          <div id="workspace-tree" class="workspace-tree"></div>
        </section>
      </aside>
    </div>

    <dialog id="settings-dialog" class="settings-dialog">
      <div class="settings-surface">
        <header class="settings-header">
          <div>
            <h2>设置</h2>
            <p>模型 API key 只保存在本机 secret store，不会在页面回显明文。</p>
          </div>
          <button id="close-settings" class="icon-button" type="button" aria-label="关闭设置" title="关闭">×</button>
        </header>

        <section class="model-settings">
          <div class="panel-heading">
            <h2>模型配置</h2>
            <span id="model-config-summary">未配置</span>
          </div>
          <form id="model-settings-form">
            <label>
              选择模型连接
              <select id="model-provider-select"></select>
            </label>
            <label>
              连接名称
              <input id="model-provider-label" autocomplete="off" placeholder="例如：阿里云百炼 DashScope" />
            </label>
            <label>
              请求协议
              <select id="model-provider-protocol">
                <option value="openai-compatible">OpenAI-compatible Chat Completions</option>
                <option value="anthropic">Anthropic Messages</option>
                <option value="google">Google Gemini GenerateContent</option>
              </select>
            </label>
            <label>
              Base URL
              <input id="model-base-url" autocomplete="off" placeholder="https://api.example.com/v1" />
            </label>
            <label>
              默认模型
              <input id="model-name" autocomplete="off" placeholder="由 provider 或自定义网关决定" />
            </label>
            <label>
              API Key
              <input id="model-api-key" type="password" autocomplete="off" placeholder="保存后不会回显明文" />
            </label>
            <div class="key-actions">
              <button type="submit">保存模型配置</button>
              <button id="test-model-provider" type="button">测试连通性</button>
              <button id="add-model-provider" type="button">新增连接</button>
              <button id="remove-model-provider" type="button">移除连接</button>
              <button id="clear-model-key" type="button">清除 Key</button>
            </div>
          </form>
          <div id="model-test-status" class="model-test-status idle">
            <span class="test-light"></span>
            <span>保存 API key 后可测试模型连通性。</span>
          </div>
          <div id="model-provider-status" class="provider-status"></div>
          <section class="assignment-section">
            <div class="panel-heading">
              <h2>角色模型分配</h2>
              <span id="assignment-summary">0</span>
            </div>
            <div id="agent-model-assignments" class="assignment-list"></div>
          </section>
        </section>
      </div>
    </dialog>

    <dialog id="start-confirm-dialog" class="confirm-dialog">
      <div class="confirm-surface">
        <h2>启动项目</h2>
        <p id="start-confirm-message">启动后 Agents 会从该项目的初始 idea 重新开始流程。</p>
        <div class="confirm-actions">
          <button id="cancel-start-project" type="button">取消</button>
          <button id="confirm-start-project" type="button">确认启动</button>
        </div>
      </div>
    </dialog>

    <dialog id="delete-confirm-dialog" class="confirm-dialog">
      <div class="confirm-surface">
        <h2>删除项目</h2>
        <p id="delete-confirm-message">删除后会移除该项目的本地进度和工作空间。</p>
        <div class="confirm-actions">
          <button id="cancel-delete-project" type="button">取消</button>
          <button id="confirm-delete-project" class="danger-button" type="button">确认删除</button>
        </div>
      </div>
    </dialog>

    <div id="toast" class="toast" hidden></div>
    <script src="/app.js" type="module"></script>
  </body>
</html>
